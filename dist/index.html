<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1533">
  <title>知识底座 · 领域知识管理</title>
  <meta name="description" content="多领域知识管理与知识服务构建交互演示">
  <link rel="stylesheet" href="./styles.css?v=33">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" data-route="overview" aria-label="知识底座首页">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span><b>知识底座</b></span>
      </a>
      <nav id="main-nav" aria-label="主导航"></nav>
    </aside>

    <main>
      <header class="topbar">
        <div class="breadcrumb"><span id="page-section">首页</span><b>/</b><strong id="page-crumb">知识底座首页</strong></div>
        <div class="top-actions">
          <button class="icon-btn" data-action="toggle-help" aria-label="演示说明">?</button>
          <div class="domain-switcher" id="domain-switcher" tabindex="0" aria-label="切换领域">
            <span class="top-domain-badge" id="top-domain-badge">经</span>
            <span><small>当前领域</small><b id="top-domain-name">经营</b></span>
            <span class="chev">⌄</span>
            <div class="domain-menu" id="domain-menu"></div>
          </div>
          <div class="role-switcher" id="role-switcher" tabindex="0" aria-label="切换角色">
            <span class="avatar" id="role-avatar">管</span>
            <span><small>当前视角</small><b id="role-name">领域知识管理员</b></span>
            <span class="chev">⌄</span>
            <div class="role-menu" id="role-menu"></div>
          </div>
        </div>
      </header>

      <section class="stage-strip" id="stage-strip" aria-label="知识旅程阶段"></section>
      <section class="page" id="page" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <script src="./app.js?v=33"></script>
</body>
</html>
